; PHP 运行参数覆盖（由 nginx-php 镜像注入，扫描目录 /opt/php-8.5/etc/php/conf.d）
memory_limit = 200M
post_max_size = 200M
upload_max_filesize = 280M

; 错误上报策略：
;   1. 屏蔽 E_DEPRECATED（8192）：老代码（CI3 等）在 PHP 8.x 产生大量弃用警告，
;      已知致命项已在应用侧修复，此处统一压制剩余弃用告警（如 finfo_close/imagedestroy）。
;      注意：仅压制警告，PHP 9 将移除项的致命错误不受影响，仍会正常暴露。
;   2. display_errors 关闭：生产环境不得向浏览器输出错误详情（信息泄露），
;      错误仍写入日志（log_errors = On）。
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
